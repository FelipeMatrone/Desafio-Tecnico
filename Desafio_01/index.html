<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <form class="formulario">
            <h1>Criar conta</h1>
            <p class="descricao">Preencha os campos para se cadastrar.</p>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3"
                    autocomplete="name">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required
                    autocomplete="email">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" required
                    minlength="8" autocomplete="new-password">
            </div>

            <button type="submit">Cadastrar</button>

            <p class="rodape">Todos os campos são obrigatórios.</p>
        </form>
    </main>
</body>

</html>
